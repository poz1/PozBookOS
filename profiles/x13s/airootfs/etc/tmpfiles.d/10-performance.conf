# --- MGLRU ---

# MGLRU: enable main + leaf PTE clearing (non-leaf PTE requires FEAT_HAFT, absent on Cortex-X1/A78)
w /sys/kernel/mm/lru_gen/enabled - - - - 3

# MGLRU: protect working set for 1 second (prevents thrashing)
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000

# --- THP ---

# THP: madvise mode for 2MB pages (apps opt in, avoids compaction latency)
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise

# THP defrag: background defrag + madvise (good compromise)
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise

# mTHP: enable 64KB hugepages system-wide (ARM64 contiguous PTE — single TLB entry, minimal compaction cost)
w /sys/kernel/mm/transparent_hugepage/hugepages-64kB/enabled - - - - always

# --- DAMON ---

# DAMON Reclaim: proactively page out cold memory (unused for 120s) to ZRAM
w /sys/module/damon_reclaim/parameters/enabled - - - - Y
w /sys/module/damon_reclaim/parameters/min_age - - - - 120000000
w /sys/module/damon_reclaim/parameters/quota_ms - - - - 10
w /sys/module/damon_reclaim/parameters/quota_sz - - - - 134217728
w /sys/module/damon_reclaim/parameters/wmarks_mid - - - - 400
w /sys/module/damon_reclaim/parameters/wmarks_low - - - - 200

# DAMON LRU Sort: promote hot pages and demote cold pages on LRU lists
w /sys/module/damon_lru_sort/parameters/enabled - - - - Y
w /sys/module/damon_lru_sort/parameters/hot_thres_access_freq - - - - 50
w /sys/module/damon_lru_sort/parameters/cold_min_age - - - - 120000000
w /sys/module/damon_lru_sort/parameters/quota_ms - - - - 10

# --- NVMe ---

# NVMe: enable Autonomous Power State Transitions (allow PS3/PS4 low-power states)
w /sys/module/nvme_core/parameters/default_ps_max_latency_us - - - - 25000

# NVMe: increase read-ahead for sequential read throughput
w /sys/block/nvme0n1/queue/read_ahead_kb - - - - 2048

# NVMe: reduce nr_requests for lower latency (default 1024 is excessive for NVMe)
w /sys/block/nvme0n1/queue/nr_requests - - - - 256

# --- Scheduler ---

# EEVDF: reduce base slice for better interactive latency (default 3ms -> 1.5ms)
w /sys/kernel/debug/sched/base_slice_ns - - - - 1500000

# EAS: ensure energy-aware scheduling is active for big.LITTLE
w /proc/sys/kernel/sched_energy_aware - - - - 1

# RT tasks: don't force max frequency by default (save power on battery)
w /proc/sys/kernel/sched_util_clamp_min_rt_default - - - - 0

# Scheduler: reduce migration cost for big.LITTLE (Cortex-X1 + A78) to prevent spurious migrations
w /proc/sys/kernel/sched_migration_cost_ns - - - - 500000

# schedutil: increase rate limit to reduce frequency switching overhead on Qualcomm cpufreq-hw
w /sys/devices/system/cpu/cpufreq/policy0/schedutil/rate_limit_us - - - - 2000
w /sys/devices/system/cpu/cpufreq/policy4/schedutil/rate_limit_us - - - - 2000

# --- Console ---

# Console: suppress kernel printk output to reduce overhead
w /proc/sys/kernel/printk - - - - 3 3 3 3

# --- Thermal ---

# Thermal: use power_allocator governor for intelligent thermal budgeting
w /sys/devices/virtual/thermal/thermal_zone0/policy - - - - power_allocator
