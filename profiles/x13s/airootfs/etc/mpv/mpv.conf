# Use the Iris VPU when it works, fall back to software when it does not.
#
# Neither mpv nor Firefox picks a V4L2 M2M decoder on their own: without this,
# a 1080p H.264 file pins the Cortex-X1C cores and the hardware decoder this
# image went to the trouble of enabling sits idle.
#
# auto-safe rather than v4l2m2m-copy on purpose: forcing the decoder makes mpv
# fail to open a file the VPU cannot handle, instead of quietly decoding it in
# software.
hwdec=auto-safe
