# --- Memory: zram-optimized swap behavior ---
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 60
vm.page-cluster = 0

# --- Memory: VFS cache ---
vm.vfs_cache_pressure = 50

# --- Memory: proactive compaction for hugepage availability ---
vm.compaction_proactiveness = 20

# --- Memory: increase free reserve to reduce direct reclaim stalls ---
vm.min_free_kbytes = 131072

# --- Memory: THP ---
# Controlled via /sys/kernel/mm (see tmpfiles.d), sysctl not needed

# --- Storage: batch dirty page writeback (reduces flash writes, saves battery) ---
vm.dirty_ratio = 40
vm.dirty_background_ratio = 10
vm.dirty_writeback_centisecs = 6000
vm.dirty_expire_centisecs = 6000

# --- Kernel: reduce overhead ---
kernel.sched_autogroup_enabled = 1

# --- Kernel: prevent timer migrations to idle CPUs (allows deeper C-states) ---
kernel.timer_migration = 0

# --- Security: restrict unprivileged BPF and userfaultfd ---
kernel.unprivileged_bpf_disabled = 1
vm.unprivileged_userfaultfd = 0

# --- Network: TCP tuning ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_tw_reuse = 1

# --- Network: ECN for BBR congestion signaling ---
net.ipv4.tcp_ecn = 1

# --- Network: reduce bufferbloat on WiFi (limit unsent data in socket buffer) ---
net.ipv4.tcp_notsent_lowat = 131072

# --- Network: TCP buffer auto-tuning for WiFi 6E throughput ---
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
