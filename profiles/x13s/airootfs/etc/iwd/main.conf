[General]
EnableNetworkConfiguration=false
RoamThreshold=-75
RoamThreshold5G=-80
RoamThreshold6G=-80
# Deliberately disabled. The WCN6855 already has no stable MAC of its own under
# mainline -- the address changes across boots -- and iwd's own randomisation
# stacked a second source of change on top of that. One unstable address is
# enough to debug. For a persistent factory MAC, use dtbloader.
AddressRandomization=disabled
ManagementFrameProtection=1

[Scan]
DisablePeriodicScan=false
InitialPeriodicScanInterval=10
MaximumPeriodicScanInterval=300

[Rank]
BandModifier5Ghz=2.0
BandModifier6Ghz=3.0
