# snd_soc_wsa883x: enable power saving for speaker amplifier codec
options snd_soc_wsa883x power_save=1

# snd_soc_wcd938x: enable power saving for audio codec
options snd_soc_wcd938x power_save=1

# ath11k: native WiFi frame mode for lower CPU overhead and better power efficiency
options ath11k frame_mode=2

# bt_hciuart: enable Bluetooth power saving for QCA UART controller
options bt_hciuart power_save=1
