# snd_soc_wsa883x and snd_soc_wcd938x have no power_save module parameter --
# neither driver declares a single module_param(), so the previous options here
# were logged as "unknown parameter ... ignored" and did nothing. Codec idle is
# handled by the drivers' own runtime-PM autosuspend delay, which is a constant.

# ath11k: Ethernet-mode frame encapsulation, offloads 802.11 header handling to
# the hardware. (Note: frame_mode=2 is "ethernet", not "native wifi" as the
# previous comment claimed -- native wifi is mode 1.)
options ath11k frame_mode=2

# bt_hciuart: Bluetooth power saving for the QCA UART controller
options bt_hciuart power_save=1
