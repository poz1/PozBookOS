# NVMe Autonomous Power State Transitions.
# nvme_core reads default_ps_max_latency_us exactly once, at controller probe,
# to seed the device's PM QoS latency tolerance. Writing it afterwards through
# /sys/module/... (as tmpfiles.d used to) never reaches the controller, so the
# setting only takes effect from modprobe.d or the kernel command line.
options nvme_core default_ps_max_latency_us=25000
