# Blacklist modules for hardware not present on the ThinkPad X13s (SC8280XP)

# No Broadcom wireless
blacklist b43
blacklist b43legacy
blacklist ssb
blacklist bcma

# No Intel wireless/GPU
blacklist iwlwifi
blacklist iwlmvm
blacklist i915

# No AMD GPU
blacklist amdgpu
blacklist radeon

# No PC speaker / PS/2 on ARM64
blacklist pcspkr
blacklist snd_pcsp
blacklist atkbd
blacklist i8042

# No floppy on ARM64
blacklist floppy

# X13s uses UART Bluetooth (QCA), not USB Bluetooth
blacklist btusb
