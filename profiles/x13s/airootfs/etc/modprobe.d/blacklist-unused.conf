# Blacklist modules for hardware not present on the ThinkPad X13s (SC8280XP)
# Note: these are also not compiled in linux-x13s, but blacklisted as
# defense-in-depth in case a user switches to a generic kernel.

# No Broadcom wireless
blacklist b43
blacklist b43legacy
blacklist ssb
blacklist bcma

# No Intel wireless/GPU
blacklist iwlwifi
blacklist iwlmvm
blacklist i915

# No AMD GPU
blacklist amdgpu
blacklist radeon

# No PC speaker / PS/2 on ARM64
blacklist pcspkr
blacklist snd_pcsp
blacklist atkbd
blacklist i8042

# No floppy on ARM64
blacklist floppy

# X13s uses UART Bluetooth (QCA), not USB Bluetooth
blacklist btusb

# No USB 1.x host controllers on ARM64 SoC
blacklist ehci_hcd
blacklist ohci_hcd
