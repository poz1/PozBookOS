# ThinkPad X13s: raise the audio quantum.
#
# The known "pops and clicks" on this machine come from the LPASS/q6apm path
# underrunning at the default quantum. postmarketOS ships exactly this for
# device-lenovo-21bx and it is the single cheapest fix for the audio experience.
#
# Cost: higher audio latency. Irrelevant for a laptop that is playing back audio
# and doing installs; if you ever do low-latency work here, drop this file.
context.properties = {
  default.clock.quantum     = 1024
  default.clock.min-quantum = 1024
}
