# MGLRU: enable main + leaf PTE clearing (non-leaf PTE requires FEAT_HAFT, absent on Cortex-X1/A78)
w /sys/kernel/mm/lru_gen/enabled - - - - 3

# MGLRU: protect working set for 1 second (prevents thrashing)
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000

# THP: madvise mode (apps opt in, avoids compaction latency)
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise

# THP defrag: background defrag + madvise (good compromise)
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
