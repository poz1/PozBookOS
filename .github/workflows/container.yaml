name: Build CI container

on:
  workflow_dispatch: {}
  push:
    paths:
      - "container/**"
      - ".github/workflows/container.yaml"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download and verify ALARM rootfs tarball
        # This tarball becomes the entire CI container. It was previously fetched
        # over plain HTTP, with no integrity check and without curl --fail, so an
        # HTTP error page would have been written to the file and the step would
        # still have succeeded. os.archlinuxarm.org has no valid TLS certificate;
        # de3.mirror.archlinuxarm.org does, and publishes the .md5 alongside.
        env:
          MIRROR: https://de3.mirror.archlinuxarm.org/os
          TARBALL: ArchLinuxARM-aarch64-latest.tar.gz
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o "container/$TARBALL" "$MIRROR/$TARBALL"
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/rootfs.md5 "$MIRROR/$TARBALL.md5"
          ( cd container && md5sum -c /tmp/rootfs.md5 )

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/alarm-ci
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: container
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
