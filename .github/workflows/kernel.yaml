name: Build kernel package

on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    paths:
      - "kernel/linux-x13s/**"
      - ".github/workflows/kernel.yaml"

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/${{ github.repository }}/alarm-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # Turn "the committed config is not what Kconfig produces" into a build
      # failure. See prepare() in the PKGBUILD.
      POZBOOK_STRICT_CONFIG: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Build kernel package
        run: |
          set -euo pipefail
          chown -R builder: kernel/linux-x13s
          cd kernel/linux-x13s
          su builder -c "MAKEFLAGS=-j\$(nproc) POZBOOK_STRICT_CONFIG=1 makepkg --noconfirm"

      - name: Upload kernel package
        uses: actions/upload-artifact@v7
        with:
          name: linux-x13s
          path: kernel/linux-x13s/*.pkg.tar.*
          if-no-files-found: error
