name: Build ISO

on:
  workflow_dispatch:
    inputs:
      withKernel:
        description: "Build kernel from source (true) or use latest kernel artifact (false)"
        required: true
        default: "false"
        type: boolean
  push:
    paths:
      - "profiles/x13s/**"
      - ".github/workflows/iso.yaml"

jobs:
  kernel:
    if: ${{ github.event.inputs.withKernel == 'true' }}
    uses: ./.github/workflows/kernel.yaml

  build:
    runs-on: ubuntu-24.04-arm
    needs: [kernel]
    if: ${{ always() && (needs.kernel.result == 'success' || needs.kernel.result == 'skipped') }}
    container:
      image: menci/archlinuxarm:latest
    steps:
      - name: Init pacman keyring
        run: |
          # Disable pacman download sandbox — Landlock not available in GitHub Actions containers
          sed -i 's/^#\?DisableSandbox/DisableSandbox/' /etc/pacman.conf
          grep -q '^DisableSandbox' /etc/pacman.conf || echo 'DisableSandbox' >> /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinuxarm

      - name: Install archiso
        run: |
          pacman -Syu --noconfirm
          # archiso is arch=any (shell scripts only) but not in ALARM repos — fetch from official Arch mirrors
          curl -Lo /tmp/archiso.pkg.tar.zst "https://archlinux.org/packages/extra/any/archiso/download/"
          pacman -U --noconfirm /tmp/archiso.pkg.tar.zst

      - uses: actions/checkout@v4

      - name: Download kernel artifact (from this run)
        if: ${{ needs.kernel.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: linux-x13s
          path: /tmp/kernel-pkg

      - name: Download latest kernel artifact (from previous run)
        if: ${{ needs.kernel.result == 'skipped' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: kernel.yaml
          name: linux-x13s
          path: /tmp/kernel-pkg

      - name: Inject kernel package into local repo
        run: |
          repo-add /tmp/kernel-pkg/linux-x13s.db.tar.gz /tmp/kernel-pkg/*.pkg.tar.*
          printf '\n[linux-x13s-local]\nSigLevel = Optional TrustAll\nServer = file:///tmp/kernel-pkg\n' >> profiles/x13s/pacman.conf

      - name: Build ISO
        run: mkarchiso -v profiles/x13s

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-x13s
          path: out/*.iso
