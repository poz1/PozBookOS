# Drop-in for %PKGBASE% on installed systems.
# Aligned with the live image's module list: without the PCIe QMP PHY and the
# SC8280XP interconnect driver in the initramfs there is no NVMe, and therefore
# no root filesystem, on an X13s.
MODULES=(nvme
         phy_qcom_qmp_pcie
         qnoc-sc8280xp
         i2c_hid_of
         i2c_qcom_geni
         leds_qcom_lpg
         pwm_bl
         qrtr
         pmic_glink_altmode
         gpio_sbu_mux
         phy_qcom_qmp_combo
         gpucc_sc8280xp
         dispcc_sc8280xp
         panel_edp
         msm
         phy_qcom_edp
         qcom_q6v5_pas
)

BINARIES=()

FILES=()

HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block encrypt filesystems fsck)
